name: Basic CI

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run build
        run: echo "CI is running"
```
**Save with Ctrl + S**

🎙️ Say: *"This is our GitHub Actions workflow — it triggers automatically on every pull request"*

---

### STEP 5 — Save and Push
First commit everything:
```
git add .
git commit -m "Add basic CI"
```
Then connect to GitHub and push:
```
git remote add origin https://github.com/YOUR-USERNAME/demo-ci-repo.git
git branch -M main
git push -u origin main
```
🎙️ Say: *"CI is now CREATED. This completes Practical 1"*

